name: Kūrėjų sąrašo valdymas

# Svetainės mygtukai „Pridėti“ ir „×“ atidaro GitHub issue su pavadinimu
# „[pridėti] @paskyra“ arba „[pašalinti] @paskyra“. Veikia tik repozitorijos savininkui.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: trendmap-data
  cancel-in-progress: false

jobs:
  manage:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[pridėti]') || startsWith(github.event.issue.title, '[pašalinti]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml python-dateutil
      - name: Atnaujinti sąrašą
        id: run
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          MSG=$(python run.py manage-creators)
          echo "$MSG"
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"
      - name: Išsaugoti
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "trendmap-bot"
          git config user.email "trendmap-bot@users.noreply.github.com"
          git add config/creators.yml
          git diff --cached --quiet || git commit -m "Kūrėjai: $ISSUE_TITLE"
          git pull --rebase
          git push
      - name: Uždaryti issue
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.run.outputs.msg }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "$MSG"
