name: Kasdienis portalų surinkimas

on:
  schedule:
    - cron: "17 3 * * *"   # kasdien ~6:17 Vilniaus laiku
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendmap-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py collect-portals
      - name: Išsaugoti duomenis
        run: |
          git config user.name "trendmap-bot"
          git config user.email "trendmap-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Portalai: $(date -u +%F)"
          git pull --rebase
          git push
