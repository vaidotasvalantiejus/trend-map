name: Savaitinė ataskaita

on:
  schedule:
    - cron: "47 4 * * 1"   # pirmadieniais ~7:47 Vilniaus laiku
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendmap-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Surinkti, analizuoti, sugeneruoti
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python run.py weekly
      - name: Išsaugoti
        run: |
          git config user.name "trendmap-bot"
          git config user.email "trendmap-bot@users.noreply.github.com"
          git add data docs reports
          git diff --cached --quiet || git commit -m "Savaitinė ataskaita: $(date -u +%F)"
          git pull --rebase
          git push
